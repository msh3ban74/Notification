# Rafeeq — Branch CI
#
# Builds the app on every push to a development branch so build health is
# verified continuously (the existing "Extract ZIP & Build Signed Release
# APK" workflow only runs when a .zip is pushed to main — it is untouched).
#
# Produces an installable debug APK artifact for every push.
name: Rafeeq Branch CI

on:
  push:
    branches:
      - "claude/**"
      - "feature/**"
      - "develop"
  workflow_dispatch:

# contents: write so the workflow can publish the debug APK to the
# "debug-latest" release — a permanent public download link.
permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # The secrets gradle plugin resolves .env/.env.example at project
      # configuration time, and generating the wrapper below already
      # configures the project — so these files MUST exist first.
      - name: Write .env from secrets
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          if [ ! -f ".env.example" ]; then
            echo "GEMINI_API_KEY=" > .env.example
          fi

      - name: Write local.properties from secrets
        run: |
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> local.properties
          if [ -z "${{ secrets.GOOGLE_WEB_CLIENT_ID }}" ]; then
            echo "::warning::GOOGLE_WEB_CLIENT_ID secret is empty — Google Sign-In will not work in this APK. Add it in repo Settings → Secrets → Actions."
          fi

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f "gradlew" ] || [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating missing Gradle Wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Generate debug keystore
        # The repo's debug signing config expects ./debug.keystore with the
        # standard Android debug alias/passwords; the file itself is not
        # committed, so create it on the runner.
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rafeeq-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # ---- Signed RELEASE build — same secrets and signing key as the
      # ---- existing "Extract ZIP & Build Signed Release APK" workflow,
      # ---- so the APK carries the user's real (Firebase-registered)
      # ---- certificate.
      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/release-key.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Remove keystore file
        if: always()
        run: rm -f "${{ github.workspace }}/release-key.jks"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: rafeeq-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Emulator deep UI test (walk every screen)
        # Boots a real Android emulator, installs the signed release APK,
        # then walks the WHOLE app: skip auth → Dashboard (scroll) → every
        # bottom-nav tab → the "+" sheet and every Smart Item form →
        # Settings → AI suggestion pill → finally 400 random monkey events.
        # After EVERY step it checks logcat for FATAL EXCEPTION and fails
        # with the stack printed; a screenshot of each screen is uploaded.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p shots
            adb install -r "$(ls app/build/outputs/apk/release/*.apk | head -1)"
            adb logcat -c
            adb shell am start -n com.notification.app/.MainActivity
            sleep 22

            snap() { adb exec-out screencap -p > "shots/$1.png" || true; }

            checkpoint() {
              sleep 1
              if adb logcat -d | grep -q "FATAL EXCEPTION"; then
                echo "==================== CRASH at step: $1 ===================="
                adb logcat -d | grep -A 40 "FATAL EXCEPTION" | head -100
                snap "CRASH-$1"
                exit 1
              fi
              echo "OK: $1"
              snap "$1"
            }

            tap_text() {
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
              adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1 || true
              COORDS=$(python3 -c "
            import re, sys
            try:
                xml = open('ui.xml', encoding='utf-8').read()
            except Exception:
                print(''); sys.exit()
            pat = sys.argv[1]
            for node in re.finditer(r'<node[^>]*>', xml):
                n = node.group(0)
                if re.search('(text|content-desc)=\"[^\"]*' + re.escape(pat) + '[^\"]*\"', n):
                    b = re.search(r'bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"', n)
                    if b:
                        print((int(b.group(1)) + int(b.group(3))) // 2,
                              (int(b.group(2)) + int(b.group(4))) // 2)
                        sys.exit()
            print('')
            " "$1")
              if [ -n "$COORDS" ]; then
                adb shell input tap $COORDS
                echo "tapped '$1' at $COORDS"
                sleep 2
              else
                echo "NOT FOUND (skipping): '$1'"
              fi
            }

            checkpoint "01-launch-auth"
            tap_text "تخطي"; tap_text "Skip"
            checkpoint "02-dashboard"

            adb shell input swipe 540 1800 540 600 400; sleep 1
            adb shell input swipe 540 600 540 1800 400; sleep 1
            checkpoint "03-dashboard-scroll"

            tap_text "المساعد";  checkpoint "04-ai-tab"
            tap_text "المهام";   checkpoint "05-tasks-tab"
            tap_text "الإشعارات"; checkpoint "06-notifications-tab"
            tap_text "الرئيسية"; checkpoint "07-back-to-dashboard"

            # The "+" smart item sheet and every real form
            tap_text "إضافة"; tap_text "Add"
            checkpoint "08-smart-sheet"
            for ITEM in "مهمة" "فاتورة" "موعد" "دواء" "دين" "جمعية"; do
              tap_text "$ITEM"
              checkpoint "09-form-$ITEM"
              adb shell input keyevent 4; sleep 1
              tap_text "إضافة"; tap_text "Add"
            done
            adb shell input keyevent 4; sleep 1

            # Settings via the profile button, then back
            tap_text "الرئيسية"; sleep 1
            adb shell input tap 90 145 || true; sleep 2
            checkpoint "10-settings-or-topbar"
            adb shell input keyevent 4; sleep 1

            # AI: tap a suggestion pill (network may fail — must not crash)
            tap_text "المساعد"; sleep 1
            tap_text "مهامي اليوم"
            sleep 6
            checkpoint "11-ai-suggestion-sent"

            # Random exploration
            adb shell monkey -p com.notification.app --throttle 250 --pct-syskeys 0 400 || true
            sleep 4
            adb logcat -d > logcat-full.txt || true
            if grep -q "FATAL EXCEPTION" logcat-full.txt; then
              echo "==================== CRASH during monkey ===================="
              grep -A 40 "FATAL EXCEPTION" logcat-full.txt | head -100
              exit 1
            fi
            echo "Deep UI test passed — every screen visited, no fatal exceptions."

      - name: Upload smoke-test logcat and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logcat
          path: |
            logcat-full.txt
            shots/
          if-no-files-found: ignore

      - name: Publish APKs to the rafeeq-latest release
        # ONE rolling release ("rafeeq-latest") always holding the newest
        # signed release APK (primary) plus the debug APK — permanent
        # public download links:
        # .../releases/download/rafeeq-latest/Rafeeq-release.apk
        # .../releases/download/rafeeq-latest/Rafeeq-debug.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" Rafeeq-release.apk
          cp "$(ls app/build/outputs/apk/debug/*.apk | head -1)" Rafeeq-debug.apk
          if ! gh release view rafeeq-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create rafeeq-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Rafeeq (latest)" \
              --notes "Rolling release: newest signed release APK (and debug APK) built by Rafeeq Branch CI."
          fi
          gh release upload rafeeq-latest Rafeeq-release.apk Rafeeq-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          # One-time cleanup of the older debug-only rolling release.
          gh release delete debug-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
