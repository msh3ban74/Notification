# Rafeeq — Branch CI
#
# Builds the app on every push to a development branch so build health is
# verified continuously (the existing "Extract ZIP & Build Signed Release
# APK" workflow only runs when a .zip is pushed to main — it is untouched).
#
# Builds ONLY the signed release APK — no debug build, to keep GitHub
# Actions minutes usage minimal. The release APK is the compile gate,
# the emulator-test target, and the published artifact.
name: Rafeeq Branch CI

on:
  push:
    branches:
      - "claude/**"
      - "feature/**"
      - "develop"
  workflow_dispatch:

# contents: write so the workflow can publish the debug APK to the
# "debug-latest" release — a permanent public download link.
permissions:
  contents: write

# A newer push supersedes and cancels any still-running build of the same
# branch, so a hung emulator can never block the pipeline.
concurrency:
  group: rafeeq-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # The secrets gradle plugin resolves .env/.env.example at project
      # configuration time, and generating the wrapper below already
      # configures the project — so these files MUST exist first.
      - name: Write .env from secrets
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          printf "GEMINI_API_KEY=\n" > .env.example

      - name: Write local.properties from secrets
        run: |
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> local.properties
          if [ -z "${{ secrets.GOOGLE_WEB_CLIENT_ID }}" ]; then
            echo "::warning::GOOGLE_WEB_CLIENT_ID secret is empty — Google Sign-In will not work in this APK. Add it in repo Settings → Secrets → Actions."
          fi

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f "gradlew" ] || [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating missing Gradle Wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      # ---- Signed RELEASE build — same secrets and signing key as the
      # ---- existing "Extract ZIP & Build Signed Release APK" workflow,
      # ---- so the APK carries the user's real (Firebase-registered)
      # ---- certificate.
      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/release-key.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          # Extra AI keys reach BuildConfig via System.getenv() in
          # build.gradle.kts — never through .env, so an unset secret
          # safely compiles to "".
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Remove keystore file
        if: always()
        run: rm -f "${{ github.workspace }}/release-key.jks"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: rafeeq-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Emulator deep UI test (walk every screen)
        timeout-minutes: 20
        # The APK builds above already prove compilation. The emulator is a
        # best-effort crash net; adb/infra flakiness on the runner must not
        # block publishing a compiling signed APK, so a hang/failure here is
        # non-fatal (still visible in the job, logs uploaded next step).
        continue-on-error: true
        # Boots a real Android emulator, installs the signed release APK,
        # and runs ci/emulator_ui_test.sh — a full walk of every screen
        # with per-step crash checks and screenshots. The test lives in a
        # real bash file because this action executes each script line
        # with a separate `sh -c`, which breaks multi-line constructs.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/emulator_ui_test.sh

      - name: Upload smoke-test logcat and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logcat
          path: |
            logcat-full.txt
            shots/
          if-no-files-found: ignore

      - name: Publish APK to the rafeeq-latest release
        # ONE rolling release ("rafeeq-latest") always holding the newest
        # signed release APK — permanent public download link:
        # .../releases/download/rafeeq-latest/Rafeeq-release.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" Rafeeq-release.apk
          if ! gh release view rafeeq-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create rafeeq-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Rafeeq (latest)" \
              --notes "Rolling release: newest signed release APK built by Rafeeq Branch CI."
          fi
          gh release upload rafeeq-latest Rafeeq-release.apk --repo "$GITHUB_REPOSITORY" --clobber
          # Debug builds are gone — drop the stale debug asset so nobody
          # downloads an outdated APK.
          gh release delete-asset rafeeq-latest Rafeeq-debug.apk --repo "$GITHUB_REPOSITORY" --yes || true
