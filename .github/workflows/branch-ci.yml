# Rafeeq — Branch CI
#
# Builds the app on every push to a development branch so build health is
# verified continuously (the existing "Extract ZIP & Build Signed Release
# APK" workflow only runs when a .zip is pushed to main — it is untouched).
#
# Produces an installable debug APK artifact for every push.
name: Rafeeq Branch CI

on:
  push:
    branches:
      - "claude/**"
      - "feature/**"
      - "develop"
  workflow_dispatch:

# contents: write so the workflow can publish the debug APK to the
# "debug-latest" release — a permanent public download link.
permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # The secrets gradle plugin resolves .env/.env.example at project
      # configuration time, and generating the wrapper below already
      # configures the project — so these files MUST exist first.
      - name: Write .env from secrets
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          if [ ! -f ".env.example" ]; then
            echo "GEMINI_API_KEY=" > .env.example
          fi

      - name: Write local.properties from secrets
        run: |
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> local.properties
          if [ -z "${{ secrets.GOOGLE_WEB_CLIENT_ID }}" ]; then
            echo "::warning::GOOGLE_WEB_CLIENT_ID secret is empty — Google Sign-In will not work in this APK. Add it in repo Settings → Secrets → Actions."
          fi

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f "gradlew" ] || [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating missing Gradle Wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Generate debug keystore
        # The repo's debug signing config expects ./debug.keystore with the
        # standard Android debug alias/passwords; the file itself is not
        # committed, so create it on the runner.
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rafeeq-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK to the debug-latest release
        # Keeps ONE rolling prerelease ("debug-latest") holding the newest
        # debug APK, so there is always a permanent public download link:
        # https://github.com/<owner>/<repo>/releases/download/debug-latest/Rafeeq-debug.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" Rafeeq-debug.apk
          if ! gh release view debug-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create debug-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Rafeeq Debug (latest)" \
              --notes "Rolling prerelease: newest debug APK built by Rafeeq Branch CI." \
              --prerelease
          fi
          gh release upload debug-latest Rafeeq-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
