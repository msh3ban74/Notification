# One-click Gemini API smoke test — verifies the GEMINI_API_KEY secret
# and the model endpoint the app calls, WITHOUT building anything.
# Prints only the HTTP status and response body (never the key).
name: AI Smoke Test

on:
  workflow_dispatch:

permissions: {}

jobs:
  ai-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Call generateContent with the app's model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "RESULT: SECRET_EMPTY — GEMINI_API_KEY secret is not set"
            exit 0
          fi
          BODY='{"contents":[{"role":"user","parts":[{"text":"Say OK"}]}],"generationConfig":{"thinkingConfig":{"thinkingBudget":0}}}'
          STATUS=$(curl -s -o resp.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -d "$BODY" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent")
          echo "HTTP_STATUS: $STATUS"
          echo "RESPONSE (truncated):"
          head -c 1500 resp.json
          echo ""
          # Also list which models this key can actually use.
          echo "AVAILABLE FLASH MODELS FOR THIS KEY:"
          curl -s -H "x-goog-api-key: $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models?pageSize=50" \
            | grep -o '"name": *"models/[^"]*"' | grep -i flash || echo "(model list unavailable)"
