# One-click Gemini API smoke test — verifies the GEMINI_API_KEY secret
# and the model endpoint the app calls, WITHOUT building anything.
# Prints only the HTTP status and response body (never the key).
name: AI Smoke Test

on:
  workflow_dispatch:

permissions: {}

jobs:
  ai-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Call generateContent exactly like the app
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "RESULT: SECRET_EMPTY — GEMINI_API_KEY secret is not set"
            exit 0
          fi
          BODY='{"contents":[{"role":"user","parts":[{"text":"Say OK"}]}],"generationConfig":{"thinkingConfig":{"thinkingBudget":0}}}'
          STATUS=$(curl -s -o resp.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=$GEMINI_API_KEY")
          echo "HTTP_STATUS_WITH_THINKING_CONFIG: $STATUS"
          head -c 800 resp.json; echo ""
          BODY2='{"contents":[{"role":"user","parts":[{"text":"Say OK"}]}]}'
          STATUS2=$(curl -s -o resp2.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$BODY2" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=$GEMINI_API_KEY")
          echo "HTTP_STATUS_PLAIN: $STATUS2"
          head -c 800 resp2.json; echo ""
          # Replicate the APP's exact request: tools + systemInstruction.
          BODY3='{"contents":[{"role":"user","parts":[{"text":"What are my tasks?"}]}],"tools":[{"functionDeclarations":[{"name":"getReminders","description":"Get reminders","parameters":{"type":"OBJECT","properties":{}}}]}],"systemInstruction":{"parts":[{"text":"You are Rafeeq."}]}}'
          STATUS3=$(curl -s -o resp3.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$BODY3" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=$GEMINI_API_KEY")
          echo "HTTP_STATUS_APP_SHAPE (tools+systemInstruction): $STATUS3"
          head -c 1200 resp3.json; echo ""
