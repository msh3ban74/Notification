name: Extract ZIP & Build Signed Release APK

on:
  push:
    paths:
      - "**.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate the uploaded zip
        id: findzip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found in repo root."
            exit 1
          fi
          echo "Found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Remove old project files
        run: |
          ZIP_NAME=$(basename "${{ steps.findzip.outputs.zip_file }}")
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "$ZIP_NAME" \
            -exec rm -rf {} +

      - name: Unzip new project files
        run: |
          unzip -o "${{ steps.findzip.outputs.zip_file }}" -d .
          rm -f "${{ steps.findzip.outputs.zip_file }}"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update: extracted latest project zip [skip ci]" || echo "Nothing new to commit"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f "gradlew" ] || [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating missing Gradle Wrapper..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Write .env from secrets
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Write local.properties from secrets
        run: |
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> local.properties

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/release-key.jks"

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease

      - name: Remove keystore file
        if: always()
        run: rm -f "${{ github.workspace }}/release-key.jks"

      - name: Locate signed APK
        id: findapk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -iname "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found after build."
            exit 1
          fi
          echo "Found: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: notification-release-signed
          path: ${{ steps.findapk.outputs.apk_path }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Notification - Release Build #${{ github.run_number }}"
          files: ${{ steps.findapk.outputs.apk_path }}
